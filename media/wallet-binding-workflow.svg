<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a">CryptoSure — Binding an Insurance Policy to One Wallet</text>
  <text x="800" y="82" text-anchor="middle" font-size="17" fill="#64748b">Validate the user &#8594; prove wallet control &#8594; validate the wallet &#8594; bind the policy. Identity never leaves the private side.</text>

  <!-- ===== LEFT ZONE: OFF-CHAIN ===== -->
  <rect x="40" y="110" width="620" height="740" rx="16" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="2"/>
  <text x="350" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#57534e" letter-spacing="2">OFF-CHAIN (private)</text>

  <!-- User + Wallet -->
  <rect x="80" y="180" width="260" height="80" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="210" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Test Persona</text>
  <text x="210" y="242" text-anchor="middle" font-size="15" fill="#64748b">user + wallet keys</text>

  <!-- KYCz oracle (black box) -->
  <rect x="80" y="310" width="260" height="90" rx="12" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="210" y="345" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">KYCz Oracle</text>
  <text x="210" y="370" text-anchor="middle" font-size="15" fill="#9ca3af">black box &#8226; pass / fail</text>

  <!-- GeoZ oracle (black box) -->
  <rect x="80" y="430" width="260" height="90" rx="12" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="210" y="465" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">GeoZ Oracle</text>
  <text x="210" y="490" text-anchor="middle" font-size="15" fill="#9ca3af">black box &#8226; in region?</text>

  <!-- Wallet screening -->
  <rect x="80" y="550" width="260" height="90" rx="12" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="210" y="585" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Wallet Screening</text>
  <text x="210" y="610" text-anchor="middle" font-size="15" fill="#9ca3af">black box &#8226; not banned?</text>

  <!-- Policy document -->
  <rect x="80" y="690" width="260" height="110" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="210" y="725" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Policy Document</text>
  <text x="210" y="750" text-anchor="middle" font-size="14" fill="#64748b">coverage, premium, terms</text>
  <text x="210" y="775" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">stays private — only hash crosses</text>

  <!-- persona -> input spine -> oracles (in port, upper) -->
  <line x1="340" y1="220" x2="400" y2="220" stroke="#475569" stroke-width="2.5"/>
  <line x1="400" y1="220" x2="400" y2="345" stroke="#475569" stroke-width="2.5"/>
  <line x1="400" y1="345" x2="340" y2="345" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="465" x2="340" y2="465" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="585" x2="340" y2="585" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="345" x2="400" y2="585" stroke="#475569" stroke-width="2.5"/>

  <!-- oracles -> output bus -> bind_wallet (out port, lower) -->
  <line x1="340" y1="375" x2="640" y2="375" stroke="#475569" stroke-width="2.5"/>
  <line x1="340" y1="495" x2="640" y2="495" stroke="#475569" stroke-width="2.5"/>
  <line x1="340" y1="615" x2="640" y2="615" stroke="#475569" stroke-width="2.5"/>
  <line x1="640" y1="315" x2="640" y2="615" stroke="#475569" stroke-width="2.5"/>
  <line x1="640" y1="315" x2="815" y2="315" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="490" y="365" text-anchor="middle" font-size="13" fill="#64748b">commitments only</text>

  <!-- divider -->
  <line x1="700" y1="120" x2="700" y2="840" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="700" y="875" text-anchor="middle" font-size="14" fill="#94a3b8">trust boundary — nothing crosses but commitments, proofs &amp; one hash</text>

  <!-- ===== RIGHT ZONE: ON-CHAIN ===== -->
  <rect x="740" y="110" width="820" height="740" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <text x="1150" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="2">ON-CHAIN (Midnight)</text>

  <!-- WalletBinder contract container -->
  <rect x="790" y="175" width="480" height="480" rx="14" fill="#111c30" stroke="#3b82f6" stroke-width="2"/>
  <text x="1030" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#93c5fd">WalletBinder.compact</text>
  <text x="1030" y="233" text-anchor="middle" font-size="13" fill="#64748b">public contract &#8226; verifier keys from compiler</text>

  <!-- bind_wallet -->
  <rect x="820" y="255" width="420" height="120" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1030" y="290" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">bind_wallet — ZK proof</text>
  <text x="1030" y="318" text-anchor="middle" font-size="14" fill="#94a3b8">proves: KYC passed &#10003; in region &#10003; wallet clean &#10003;</text>
  <text x="1030" y="342" text-anchor="middle" font-size="14" fill="#94a3b8">without revealing who or where</text>

  <!-- prove_binding -->
  <rect x="820" y="405" width="420" height="120" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1030" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">prove_binding(policy_ref)</text>
  <text x="1030" y="468" text-anchor="middle" font-size="14" fill="#94a3b8">policy_ref = hash(policy document)</text>
  <text x="1030" y="492" text-anchor="middle" font-size="14" fill="#94a3b8">the agreement is bound — the text stays private</text>

  <!-- inner arrow bind -> prove -->
  <line x1="1030" y1="375" x2="1030" y2="400" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ledger record -->
  <rect x="820" y="565" width="420" height="70" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1030" y="595" text-anchor="middle" font-size="17" font-weight="700" fill="#4ade80">ledger: bound_wallets +1</text>
  <text x="1030" y="618" text-anchor="middle" font-size="13" fill="#86a693">public fact of a binding — zero identity</text>

  <!-- Receipt -->
  <rect x="1330" y="255" width="180" height="180" rx="14" fill="#14532d" stroke="#22c55e" stroke-width="2.5"/>
  <text x="1420" y="305" text-anchor="middle" font-size="40" fill="#4ade80">&#10003;</text>
  <text x="1420" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Binding</text>
  <text x="1420" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Receipt</text>
  <text x="1420" y="400" text-anchor="middle" font-size="12" fill="#bbf7d0">wallet &#8596; policy</text>

  <!-- dashed hash-only arrow: policy -> prove_binding -->
  <path d="M 340 745 L 670 745 L 670 490 L 815 490" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <text x="500" y="735" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">hash only</text>

  <!-- arrow contract -> receipt -->
  <line x1="1270" y1="345" x2="1325" y2="345" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- footer -->
  <text x="1150" y="700" text-anchor="middle" font-size="15" fill="#94a3b8">One binding agreement. The user is verified, the wallet is bound,</text>
  <text x="1150" y="724" text-anchor="middle" font-size="15" fill="#94a3b8">the policy is committed — and no name, address or policy text</text>
  <text x="1150" y="748" text-anchor="middle" font-size="15" fill="#94a3b8">ever appears on-chain.</text>
</svg>
